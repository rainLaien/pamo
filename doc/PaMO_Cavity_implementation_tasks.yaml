    priority: "P0"
    status: "todo"
    size: "M"
    depends_on: []
    summary: "建立统一的运行报告和指标采集"
    description: "为当前 run、remesh、simplification 和 safe projection 路径记录分阶段时间、面数、CD、HD、最小角、edge CV、流形、封闭、自交、Undo 次数和峰值显存。"
    files:
      - "simp_cuda/pamo/reporting.py"
      - "simp_cuda/pamo/__init__.py"
      - "example.py"
    deliverables:
      - "OptimizationReport 数据结构"
      - "JSON/控制台报告导出"
      - "旧路径基线报告"
    acceptance:
      - "相同输入与 seed 下报告字段稳定。"
      - "关闭报告时不改变算法输出。"
      - "报告明确标注 sdf_mode 和坐标归一化尺度。"
    tests:
      - "报告序列化 round-trip"
      - "空网格和最小合法网格字段完整性"
    risks:
      - "指标计算本身影响性能；默认区分轻量运行指标和昂贵评估指标。"

  - id: "BASE-002"
    milestone: "M0"
    priority: "P0"
