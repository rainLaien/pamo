version: 1
project: "pamo_cavity_joint_optimizer"
status: "planning"
objective: "在保留 PaMO SDF/DualMC、LBVH/Undo 和安全投影能力的基础上，引入 Cavity 事务模型、显式特征约束、maxSurfDist、多类拓扑操作，并在质量收益验证后实现 Patch/Ribbon GPU 后端。"

documents:
  architecture: "doc/PaMO_Cavity_联合改善架构.md"
  pamo_analysis: "doc/PaMO_论文算法中文分析.md"
  cavity_analysis: "doc/Dynamic_Mesh_Processing_on_the_GPU_算法流程中文总结.md"

principles:
  - "旧版 PaMO.run() 必须保持兼容并可作为基线回退。"
  - "先验证 Cavity-lite 的质量收益，再投入完整 Patch/Ribbon 重写。"
  - "所有硬约束先于软成本；不能为了达到目标面数而静默违反安全约束。"
  - "每个拒绝、撤销和停止条件必须具有机器可读原因。"
  - "exact、repair、original surface 和 feature curve 的语义必须显式区分。"
  - "最终提交检查点必须无检测到的自交。"

defaults:
  backend: "global"
  sdf_mode: "auto"
  feature_angle_degrees: 30.0
  target_length_mode: "constant"
  max_surface_distance_unit: "relative_bbox"
  deterministic: true
  global_collision_every_epochs: 1
  projection_every_epochs: 5
  final_safe_projection_steps: 5
  patch_initial_faces: 256
  patch_growth_factor: 2.0

quality_gates:
  correctness:
    - "回归集中硬特征误折叠和误翻转数量为 0。"
    - "最终输出自交对数量为 0。"
    - "Undo 后网格必须恢复到拓扑等价且属性一致的状态。"
    - "所有活动面索引有效、面积非零且不存在 NaN/Inf。"
  geometry:
    - "配置 maxSurfDist 时，所有验收采样不得超过阈值加数值容差。"
    - "相同目标面数下，CD/HD 不得超过基线允许回归比例。"
    - "输出必须报告 feature recall、corner retention 和 feature curve distance。"
  performance:
    - "Cavity-lite 在 medium 基准上的 Stage 2 时间不得超过旧路径的 1.25 倍，除非质量门槛显著改善并记录豁免。"
    - "Patch backend 在 large 基准上的动态拓扑吞吐量必须高于 Cavity-lite 后才允许默认启用。"
    - "所有性能结果必须记录 GPU、CUDA、输入规模、配置和峰值显存。"

milestones:
  - id: "M0"
    name: "基线、API 与可观测性"
    exit_criteria:
      - "固定回归输入与旧 PaMO 输出。"
      - "能够生成统一质量和性能报告。"
      - "新配置对象和兼容策略评审完成。"

  - id: "M1"
    name: "Cavity-lite 事务化 Collapse"
    exit_criteria:
      - "当前 edge collapse 通过 OperationRecord 执行。"
      - "CommitJournal 和通用 Undo 闭环通过测试。"
      - "LBVH 相交结果能够映射到 operation ID。"

  - id: "M2"
    name: "硬特征与曲面距离约束"
    exit_criteria:
      - "FeatureGraph lineage 在 collapse 后保持一致。"
      - "maxSurfDist 支持 world、relative_bbox 和 voxel 单位。"
      - "硬特征误操作为 0。"

  - id: "M3"
    name: "多操作与拓扑-几何交替优化"
    exit_criteria:
      - "支持 split、collapse、flip 和 constrained relocate。"
      - "TargetLengthField 可驱动自适应操作。"
      - "能够周期性执行短投影并最终执行完整安全投影。"

  - id: "M4"
    name: "完整 Patch/Ribbon GPU 后端"
    exit_criteria:
      - "Patch、Ribbon、队列、锁、MIS、扩张和切分均可运行。"
      - "批次全局 LBVH 验收和 operation-level Undo 通过。"
      - "large 基准达到性能门槛。"

  - id: "M5"
    name: "验证、优化与发布"
    exit_criteria:
      - "质量、安全、性能消融完成。"
      - "新后端具备明确回退策略。"
      - "文档、示例、测试和迁移说明齐全。"

tasks:
